name: Cairn release

# A Cairn release is a bare X.Y.Z tag on master. It builds the mod as the project's own workflows do, puts it with the Prepatcher library it
# needs into a Cairn mod pack (.github/cairn/Build-Pack.ps1) and publishes the pack, pack-index.json and game.json: the Cairn launcher
# reads the index to install and update this mod. RELEASE_CHANNEL=beta publishes a pre-release (only players who chose beta are offered it).
# (The project's own tags are v-prefixed; a bare X.Y.Z tag is a Cairn release.)
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive   # the Languages submodule

      - name: The tag must be on master and equal VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch origin master
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw "tag $env:GITHUB_REF_NAME is not on master" }
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          if ($v -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME is not VERSION ($v)" }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Build the mod
        run: |
          dotnet restore Source/
          dotnet build Source/ --configuration Release --no-restore

      - name: Get Prepatcher at the commit this pack was made with
        shell: pwsh
        run: |
          git clone https://github.com/zetrith/Prepatcher prepatcher
          git -C prepatcher checkout 9fd173802bec8674be922c84aebbd370cb3ccbaa
          if ($LASTEXITCODE -ne 0) { throw 'the pinned Prepatcher commit is not there' }

      - name: Build the pack
        shell: pwsh
        run: ./.github/cairn/Build-Pack.ps1 -PrepatcherDir prepatcher

      - name: Changelog
        shell: pwsh
        run: ./.github/cairn/New-ReleaseNotes.ps1 -OutFile notes.md -Tag $env:GITHUB_REF_NAME

      - uses: actions/upload-artifact@v4
        with:
          name: cairn-pack
          path: |
            release/Cairn-Pack-rimworld-*.zip
            release/pack-index.json
            .github/cairn/game/game.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @("release/Cairn-Pack-rimworld-$env:GITHUB_REF_NAME.zip", 'release/pack-index.json') + (Get-ChildItem .github/cairn/game -File | ForEach-Object { $_.FullName })
          $flags = @()
          if ((Get-Content RELEASE_CHANNEL -Raw).Trim() -eq 'beta') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @assets --title $env:GITHUB_REF_NAME --notes-file notes.md --verify-tag @flags
